name: Source Contract CI
on:
  push:
  pull_request:
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Compile macOS Virtualization preflight (no VM launch)
        if: runner.os == 'macOS'
        run: |
          swiftc -framework Virtualization native/macos-vm/CapabilityProbe.swift -o "$RUNNER_TEMP/gsa-vm-capability-probe"
          "$RUNNER_TEMP/gsa-vm-capability-probe"
      - name: Compile native macOS VM worker preflight (no VM launch)
        if: runner.os == 'macOS'
        run: |
          swiftc -framework Virtualization native/macos-vm/WorkerPreflight.swift -o "$RUNNER_TEMP/gsa-vm-worker-preflight"
          printf '%s' '{"protocolVersion":"gsa-vm-worker-preflight-v1","workspaceID":"fixture","canonicalRoot":"${{ github.workspace }}","cpuCount":2,"memoryMiB":2048,"maxRuntimeMs":120000}' | "$RUNNER_TEMP/gsa-vm-worker-preflight"
      - name: Reject VM worker unsafe roots and malformed input
        if: runner.os == 'macOS'
        run: |
          set +e
          printf '%s' '{"protocolVersion":"gsa-vm-worker-preflight-v1","workspaceID":"fixture","canonicalRoot":"/","cpuCount":2,"memoryMiB":2048,"maxRuntimeMs":120000}' | "$RUNNER_TEMP/gsa-vm-worker-preflight" > "$RUNNER_TEMP/gsa-root-denied.json"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q '"state":"BLOCKED"' "$RUNNER_TEMP/gsa-root-denied.json"
          grep -q '"executionAuthorized":false' "$RUNNER_TEMP/gsa-root-denied.json"
          set +e
          printf '%s' 'not-json' | "$RUNNER_TEMP/gsa-vm-worker-preflight" > "$RUNNER_TEMP/gsa-json-denied.json"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q '"errorCode":"INVALID_INPUT"' "$RUNNER_TEMP/gsa-json-denied.json"
      - name: Syntax-check opt-in Ubuntu image preparation (never download on CI)
        run: node --check scripts/prepare-ubuntu-arm64-image.mjs

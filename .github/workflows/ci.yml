name: macOS Source and Native-Safe CI
on:
  push:
  pull_request:
jobs:
  macos-preinstall:
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Record macOS CI host
        run: |
          echo "commit=$GITHUB_SHA"
          sw_vers
          uname -m
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Build source
        run: npm run build
      - name: Run non-VM source tests
        shell: bash
        run: |
          mapfile -t tests < <(find dist/test -maxdepth 1 -type f -name '*.test.js' ! -name 'macos-vm-*' | sort)
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"
      - name: Test native source-capture fixture (no VM)
        run: python3 scripts/test-native-source-capture.py

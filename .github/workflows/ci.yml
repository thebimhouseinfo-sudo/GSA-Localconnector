name: Source Contract CI
on:
  push:
  pull_request:
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Compile macOS Virtualization preflight (no VM launch)
        if: runner.os == 'macOS'
        run: |
          swiftc -framework Virtualization native/macos-vm/CapabilityProbe.swift -o "$RUNNER_TEMP/gsa-vm-capability-probe"
          "$RUNNER_TEMP/gsa-vm-capability-probe"

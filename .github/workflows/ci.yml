name: Source Contract CI
on:
  push:
  pull_request:
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Verify worker snapshot seed (no VM starts or downloads)
        run: python3 scripts/test-vm-worker-seed.py

      - name: Verify Linux worker protocol and bounded subprocess capture
        if: runner.os != 'Windows'
        run: python3 scripts/test-vm-guest-worker.py

      - name: Verify descriptor-native source capture fixtures
        if: runner.os == 'macOS'
        run: python3 scripts/test-native-source-capture.py

      - name: Compile worker and reject malformed input before VM construction
        if: runner.os == 'macOS'
        run: |
          swiftc -framework Virtualization native/macos-vm/WorkerHost.swift -o "$RUNNER_TEMP/gsa-worker-host"
          codesign --force --sign - --entitlements native/macos-vm/Virtualization.entitlements "$RUNNER_TEMP/gsa-worker-host"
          codesign --verify --strict "$RUNNER_TEMP/gsa-worker-host"
          set +e
          printf '%s\n' 'invalid-json' | "$RUNNER_TEMP/gsa-worker-host" > "$RUNNER_TEMP/gsa-worker-invalid.json"
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q 'INVALID_CONFIG' "$RUNNER_TEMP/gsa-worker-invalid.json"

      - name: Syntax-check explicit native install and runtime test entrypoints
        run: |
          node --check scripts/install-native-vm.mjs
          node --check scripts/test-vm-runtime-native.mjs

name: Source Contract CI
on:
  push:
  pull_request:
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Compile macOS Virtualization preflight (no VM launch)
        if: runner.os == 'macOS'
        run: |
          swiftc -framework Virtualization native/macos-vm/CapabilityProbe.swift -o "$RUNNER_TEMP/gsa-vm-capability-probe"
          "$RUNNER_TEMP/gsa-vm-capability-probe"
      - name: Compile native macOS VM worker preflight (no VM launch)
        if: runner.os == 'macOS'
        run: |
          swiftc -framework Virtualization native/macos-vm/WorkerPreflight.swift -o "$RUNNER_TEMP/gsa-vm-worker-preflight"
          printf '%s' '{"protocolVersion":"gsa-vm-worker-preflight-v1","workspaceID":"fixture","canonicalRoot":"${{ github.workspace }}","cpuCount":2,"memoryMiB":2048,"maxRuntimeMs":120000}' | "$RUNNER_TEMP/gsa-vm-worker-preflight"
      - name: Reject VM worker unsafe roots and malformed input
        if: runner.os == 'macOS'
        run: |
          set +e
          printf '%s' '{"protocolVersion":"gsa-vm-worker-preflight-v1","workspaceID":"fixture","canonicalRoot":"/","cpuCount":2,"memoryMiB":2048,"maxRuntimeMs":120000}' | "$RUNNER_TEMP/gsa-vm-worker-preflight" > "$RUNNER_TEMP/gsa-root-denied.json"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q '"state":"BLOCKED"' "$RUNNER_TEMP/gsa-root-denied.json"
          grep -q '"executionAuthorized":false' "$RUNNER_TEMP/gsa-root-denied.json"
          set +e
          printf '%s' 'not-json' | "$RUNNER_TEMP/gsa-vm-worker-preflight" > "$RUNNER_TEMP/gsa-json-denied.json"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q '"errorCode":"INVALID_INPUT"' "$RUNNER_TEMP/gsa-json-denied.json"
      - name: Syntax-check opt-in Ubuntu image preparation (never download on CI)
        run: node --check scripts/prepare-ubuntu-arm64-image.mjs
      - name: Syntax-check opt-in QCOW2 converter (no conversions on CI)
        run: node --check scripts/convert-ubuntu-arm64-image.mjs
      - name: Compile and test Swift RAW disk attachment preflight without VM boot
        if: runner.os == 'macOS'
        run: |
          swiftc -framework Virtualization native/macos-vm/RawDiskPreflight.swift -o "$RUNNER_TEMP/gsa-raw-preflight"
          export IMAGE="$RUNNER_TEMP/gsa-raw-fixture.img"
          dd if=/dev/zero of="$IMAGE" bs=4096 count=1
          export DIGEST="$(shasum -a 256 "$IMAGE" | awk '{print $1}')"
          printf '{"protocolVersion":"gsa-vm-raw-preflight-v1","imagePath":"%s","expectedSHA256":"%s","expectedBytes":4096}' "$IMAGE" "$DIGEST" | "$RUNNER_TEMP/gsa-raw-preflight"
          set +e
          printf '{"protocolVersion":"gsa-vm-raw-preflight-v1","imagePath":"%s","expectedSHA256":"%s","expectedBytes":4096}' "$IMAGE" "$(printf '%064d' 0)" | "$RUNNER_TEMP/gsa-raw-preflight" > "$RUNNER_TEMP/gsa-raw-denied.json"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q '"errorCode":"DIGEST_MISMATCH"' "$RUNNER_TEMP/gsa-raw-denied.json"

      - name: Compile EFI guest configuration feasibility probe (no VM boot)
        if: runner.os == 'macOS'
        run: |
          swiftc -framework Virtualization native/macos-vm/EFIBootConfigurationPreflight.swift -o "$RUNNER_TEMP/gsa-efi-config"
          export EFI_FIXTURE="$RUNNER_TEMP/gsa-efi-fixture.raw"
          dd if=/dev/zero of="$EFI_FIXTURE" bs=4096 count=1
          printf '{"protocolVersion":"gsa-vm-efi-config-v1","rawImagePath":"%s","expectedBytes":4096}' "$EFI_FIXTURE" | "$RUNNER_TEMP/gsa-efi-config" > "$RUNNER_TEMP/gsa-efi-result.json"
          grep -q '"state":"CANDIDATE_ONLY"' "$RUNNER_TEMP/gsa-efi-result.json"
          grep -q '"efiConfigurationValid":true' "$RUNNER_TEMP/gsa-efi-result.json"
          grep -q '"executionAuthorized":false' "$RUNNER_TEMP/gsa-efi-result.json"
          set +e
          printf '{"protocolVersion":"gsa-vm-efi-config-v1","rawImagePath":"/","expectedBytes":4096}' | "$RUNNER_TEMP/gsa-efi-config" > "$RUNNER_TEMP/gsa-efi-reject.json"
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -q '"state":"BLOCKED"' "$RUNNER_TEMP/gsa-efi-reject.json"
